[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "eis-studio"
dynamic = ["version"]
description = "EIS analysis in your browser: equivalent-circuit fitting (impedance.py), DRT (pyDRTtools), conductivity and publication figures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zachary Warren" }]
requires-python = ">=3.10"
keywords = ["electrochemical impedance spectroscopy", "EIS", "DRT", "equivalent circuit", "ionic conductivity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# Lower bounds only, so the installer can fall back to older binary wheels on older OSes
# (e.g. cvxopt 1.3.2 on macOS < 15). requirements.txt pins the exact tested versions.
dependencies = [
    "streamlit>=1.45",
    "impedance>=1.7",
    "pyDRTtools>=0.2",
    "cvxopt>=1.3.2",
    "scikit-learn>=1.3",      # imported by pyDRTtools but not declared by it
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
eis-studio = "eisstudio.cli:main"

[project.urls]
Homepage = "https://zacharyslate.github.io/eis-studio/"
Source = "https://github.com/zacharyslate/eis-studio"
Issues = "https://github.com/zacharyslate/eis-studio/issues"

[tool.hatch.version]
path = "eisstudio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["eisstudio"]

[tool.hatch.build.targets.sdist]
exclude = ["docs", ".github", "ZACH-venv"]
