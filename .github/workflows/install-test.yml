# Runs the real one-line installers on Windows, macOS and Linux, launches the installed app,
# and runs the test suite. A green badge here means a new user's install works on that OS.
name: install-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install with docs/install.sh (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EIS_STUDIO_SOURCE: ${{ github.workspace }}
        run: sh docs/install.sh

      - name: Install with docs/install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EIS_STUDIO_SOURCE: ${{ github.workspace }}
        run: ./docs/install.ps1

      - name: Check shortcut and icon (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          f="$HOME/.local/share/applications/eis-studio.desktop"
          cat "$f"
          icon=$(sed -n 's/^Icon=//p' "$f")
          file "$icon" | grep -q "PNG image data, 256 x 256" && echo "icon ok: $icon"
          desktop-file-validate "$f" 2>/dev/null || true

      - name: Check app bundle and icon (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="$HOME/Applications/EIS Studio.app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/eis-studio-launcher"
          file "$app/Contents/Resources/eis-studio.icns" | grep -qi "icon" && echo "icns ok"
          test -L "$HOME/Desktop/EIS Studio" && echo "desktop link ok"
          cat "$app/Contents/MacOS/eis-studio-launcher"

      - name: Check shortcuts and icon (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shell = New-Object -ComObject WScript.Shell
          foreach ($dir in @([Environment]::GetFolderPath("Desktop"), (Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"))) {
            $path = Join-Path $dir "EIS Studio.lnk"
            if (-not (Test-Path $path)) { throw "missing shortcut $path" }
            $lnk = $shell.CreateShortcut($path)
            $icon = $lnk.IconLocation.Split(",")[0]
            "$path -> target $($lnk.TargetPath), icon $($lnk.IconLocation)"
            if (-not (Test-Path $icon)) { throw "icon file missing: $icon" }
          }

      - name: Launch installed app and check it responds (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          eis-studio --version
          eis-studio --no-browser --port 8601 > app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8601/_stcore/health; then echo " <- healthy"; exit 0; fi
            sleep 2
          done
          cat app.log; exit 1

      - name: Launch installed app and check it responds (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          eis-studio --version
          $p = Start-Process eis-studio -ArgumentList "--no-browser","--port","8601" -PassThru -RedirectStandardOutput app.log -RedirectStandardError app.err
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://localhost:8601/_stcore/health; if ($r.Content -eq "ok") { "healthy"; exit 0 } } catch {}
            Start-Sleep 2
          }
          Get-Content app.log, app.err; exit 1

      - name: Test suite (parsers, ECM/DRT recovery, app end-to-end)
        shell: pwsh   # available on all three runners; avoids Git-Bash path issues on Windows
        run: |
          $env:PATH = (Join-Path $HOME ".local/bin") + [IO.Path]::PathSeparator + $env:PATH
          uv run --python 3.12 --extra test pytest -q tests/
